<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f6" />
  <title>쉐키나 찬양팀</title>

  <style>
/* 01 정돈된 자료실 — type, spacing, and rules carry the hierarchy. */
:root {
  --bg0: #f6f7f7;
  --bg1: #f6f7f7;
  --bg2: #f6f7f7;
  --card: #fff;
  --fg: #202824;
  --muted: #6e7771;
  --soft: #f7f8f7;
  --soft2: #eff3f0;
  --bd: #e1e6e2;
  --bd2: #ced6d0;
  --shadow: none;
  --shadow2: none;
  --radius: 5px;
  --radius2: 4px;
  --accent: #20563f;
  --accentDark: #163f2e;
  --accentSoft: #eaf2ec;
  --accentSoft2: #f1f6f2;
  --teal: #20563f;
  --tealSoft: #eaf2ec;
  --ok: #20563f;
  --okSoft: #eef5ef;
  --warn: #93614d;
  --warnSoft: #f8f2ed;
  --navH: 72px;
}

* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; scroll-padding-top: 154px; }
body {
  min-height: 100%; margin: 0; color: var(--fg); background: var(--bg2);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  font-size: 14px; line-height: 1.55; letter-spacing: -.15px;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { color: var(--accentDark); background: #dbeadd; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled { cursor: default; opacity: .5; }
.wrap { width: 100%; max-width: 1260px; padding: 80px 30px 56px; margin: 0 auto; }

.topbar {
  position: sticky; top: 0; z-index: 65;
  height: calc(76px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top);
  background: #fff; border-bottom: 1px solid var(--bd);
}
.topbarInner {
  max-width: 1260px; height: 76px; margin: 0 auto; padding: 0 30px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.brand { min-width: 0; display: flex; align-items: center; gap: 12px; color: var(--fg); }
.brandMark {
  flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 3px; background: var(--accent); color: #fff;
  font-size: 20px; font-family: Georgia, serif; line-height: 1;
}
.brandCopy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brandTitle { font-size: 16px; line-height: 1.3; font-weight: 700; letter-spacing: -.4px; }
.brandSub { color: var(--muted); font-size: 11px; line-height: 1.4; }
.topStatus { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: var(--muted); font-size: 11px; white-space: nowrap; }
.dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: #b4bfb6; }
.offlineBanner { display: none; position: sticky; top: 0; z-index: 80; padding: 8px 16px; background: #7e4837; color: #fff; font-size: 12px; text-align: center; }
body.offline .offlineBanner { display: block; }

.nav {
  position: fixed; inset: calc(76px + env(safe-area-inset-top)) 0 auto; z-index: 60;
  height: 56px; background: #fff; border-bottom: 1px solid var(--bd);
}
.navInner { max-width: 1260px; height: 100%; margin: 0 auto; padding: 0 30px; display: flex; gap: 30px; align-items: stretch; }
.navBtn {
  flex: 0 0 auto; padding: 0 3px; min-width: 78px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: transparent; color: var(--muted); font-size: 13px; font-weight: 500;
}
.navBtn:hover { color: var(--fg); }
.navBtn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }
.navBtn:focus-visible { outline-offset: -5px; }
.navIcon { display: inline-flex; width: 17px; height: 17px; align-items: center; justify-content: center; }
.navIcon svg { display: block; width: 100%; height: 100%; stroke-width: 1.7; }
.navLabel { white-space: nowrap; }

.workspaceIntro { position: relative; margin: 0 0 20px; padding-right: 200px; }
.eyebrow { display: block; margin-bottom: 8px; color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: 1.7px; line-height: 1.5; text-transform: uppercase; }
.workspaceIntro h1 { margin: 0; color: #18271f; font-size: 35px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.3; }
.workspaceIntro p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.workspaceIntro .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 10px; line-height: 1.5; }
.workspaceMeta { position: absolute; right: 0; bottom: 4px; color: var(--muted); font-size: 11px; text-align: right; line-height: 1.7; }
.workspaceMeta > span { display: block; }
.workspaceMeta strong { color: var(--fg); font-weight: 600; }
.view { display: none; padding-bottom: 16px; }
.view.active { display: block; }
#viewSetlists { padding-bottom: 28px; }
.card { position: relative; padding: 24px; margin: 22px 0; border: 1px solid var(--bd); border-radius: 5px; background: #fff; box-shadow: none; }
.card:first-child { margin-top: 0; }
.searchHero { overflow: visible; padding: 18px 24px 12px; background: #fff; color: var(--fg); }
.searchHero::before, #filterCard::before { content: none; }
.searchHero label { margin-bottom: 7px; }
label { display: block; margin-bottom: 9px; color: #425248; font-size: 12px; font-weight: 600; }
.searchWrap { position: relative; }
input[type="text"] {
  display: block; width: 100%; height: 56px; padding: 12px 86px 12px 16px;
  border: 1px solid #bbc9bf; border-radius: 4px; background: #fff;
  color: var(--fg); font-size: 17px; font-weight: 500;
  transition: border-color .15s ease;
}
input[type="text"]::placeholder { color: #a0a8a2; font-size: 15px; font-weight: 400; }
input[type="text"]:focus { border-color: var(--accent); outline: 2px solid #dce9df; outline-offset: 1px; }
.muted { color: var(--muted); font-size: 12px; line-height: 1.7; }
.status { display: flex; align-items: center; gap: 7px; margin-top: 8px; min-height: 16px; color: var(--muted); font-size: 11px; font-weight: 400; white-space: pre-wrap; }
.status.ok { color: var(--accent); }
.status.bad { color: var(--warn); }
.spin { display: none; flex: 0 0 auto; width: 12px; height: 12px; border: 1.5px solid #d4e2d8; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.status.loading .spin { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.miniBtn, .btn, .clearBtn {
  min-height: 36px; padding: 7px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--bd2); border-radius: 4px; background: #fff; color: #4b594f;
  font-size: 12px; font-weight: 500; line-height: 1.35; text-decoration: none;
  user-select: none; transition: border-color .15s ease, background .15s ease;
}
.miniBtn:hover, .btn:hover, .clearBtn:hover { background: var(--soft); border-color: #a9b8ad; }
.miniBtn.active, .chipBtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.clearBtn { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); min-height: 32px; border-color: transparent; padding: 6px 10px; color: var(--muted); }
.chip, .cacheBadge {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 23px; padding: 3px 7px; border: 1px solid var(--bd); border-radius: 3px;
  background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 500; line-height: 1.35; white-space: nowrap;
}
.chip.ok { background: var(--okSoft); color: var(--accent); border-color: #dbe8de; }
.chip.warn { background: var(--warnSoft); color: var(--warn); border-color: #eadfd4; }
.cacheBadge { background: #f6f4ee; color: #807556; border-color: #e7e0cd; }
.chipBtn { cursor: pointer; background: #fff; border-color: var(--bd2); }
.chipBtn:hover { background: var(--soft); }
#weeksChip { display: none !important; }

#filterCard { padding: 0; margin: 18px 0; border: 0; border-radius: 0; background: transparent; }
#filterCard .panelTitle { font-size: 11px; font-weight: 500; color: var(--muted); }
.panelHead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.panelTitle { font-size: 17px; font-weight: 650; letter-spacing: -.4px; color: var(--fg); }
.panelMeta { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.filterRow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.filterLeft, .filterRight { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.filterLeft { flex: 1 1 auto; }
.filterRight { justify-content: flex-end; }
.filterLeft .miniBtn { padding-left: 14px; padding-right: 14px; }
#filterReset { border-color: transparent; background: transparent; color: var(--muted); }
#filterReset:hover { color: var(--accent); }
select { max-width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--bd2); border-radius: 4px; background: #fff; color: #536057; font-size: 12px; cursor: pointer; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; }
.list { min-width: 0; overflow: hidden; border: 1px solid var(--bd); border-radius: 5px; background: #fff; }
.list .head { min-height: 51px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--bd); background: #fff; color: #334239; font-size: 12px; font-weight: 600; }
.list .head > .chip { min-height: 20px; background: transparent; border-color: transparent; padding: 0; color: var(--muted); font-size: 11px; }
.list .body { max-height: none; overflow: visible; background: #fff; }
#songs { max-height: 560px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #c7d2c9 transparent; }
.collectionHeading { padding: 23px 20px 20px; margin: 0; border-bottom: 1px solid var(--bd); background: #fff; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0; padding: 13px 18px; min-height: 54px; border: 0; border-bottom: 1px solid #edf0ed; border-radius: 0; background: #fff; color: #28392e; font-size: 14px; font-weight: 500; line-height: 1.5; cursor: pointer; transition: background .15s ease; }
.item { width: 100%; text-align: left; font-family: inherit; appearance: none; }
.item:focus-visible { outline-offset: -3px; }
.item:hover { background: #f5f8f5; }
.item:last-child { border-bottom: 0; }
.item.selected, .item[aria-selected="true"] { background: #edf4ee; }
.item > :first-child { min-width: 0; overflow-wrap: anywhere; }
.item > .chip { flex: 0 0 auto; }
.item [style*="font-weight"], .item [style*="fontWeight"] { font-weight: 600 !important; }
.item b, .item strong { font-weight: 600; }
.item .muted { margin-top: 3px; font-size: 11px; line-height: 1.5; }
#songs .item > .chip { border: 0; border-radius: 0; background: transparent; padding: 0; color: #849087; font-size: 10px; }
.listFooter { padding: 13px 18px; border-top: 1px solid var(--bd); color: var(--muted); background: #fafbfa; font-size: 10px; line-height: 1.5; }
.empty { padding: 38px 22px; color: var(--muted); font-size: 13px; line-height: 1.75; text-align: center; }
#resultsEmpty { padding: 55px 26px; }
.resultSummary { padding: 0; margin: 0; border: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.resultEyebrow { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
.resultTitle { margin: 7px 0 9px; color: #20372b; font-size: 23px; font-weight: 650; line-height: 1.4; letter-spacing: -.8px; overflow-wrap: anywhere; }
.resultSummary p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th, td { padding: 15px 20px; border-bottom: 1px solid #edf0ed; text-align: left; vertical-align: top; font-size: 13px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
th { position: sticky; top: 0; z-index: 1; padding-top: 11px; padding-bottom: 11px; background: #f8faf8; color: #7b867e; font-size: 11px; font-weight: 500; }
td:first-child { color: #6c7970; }
tbody tr:hover { background: #fbfcfb; }
tbody tr:last-child td { border-bottom: 0; }
.personLink { padding: 0; border: 0; background: transparent; color: var(--accent); font-family: inherit; font-size: inherit; line-height: inherit; font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: #b9cdbf; text-underline-offset: 4px; }
.personLink:hover { color: var(--accentDark); text-decoration-color: currentColor; }
.unassigned { color: #9ba69f; font-weight: 400; }
.mediaBox { padding: 19px 20px; border-top: 1px solid var(--bd); background: #fff; }
.mediaBox > [style*="font-weight"] { font-weight: 600 !important; font-size: 12px; }
.mediaRow { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.mediaLabel { flex: 0 0 34px; padding-top: 4px; color: var(--muted); font-size: 11px; }
.mediaLinks { display: flex; gap: 7px; flex-wrap: wrap; min-width: 0; }
a.chipLink { color: var(--accent); background: #fff; text-decoration: none; border-color: #cddbd1; }
a.chipLink:hover { text-decoration: underline; text-underline-offset: 3px; }
#metaBox { border-top-color: var(--bd) !important; padding: 19px 20px !important; }
#metaBox [style*="font-weight"] { font-weight: 600 !important; }
.dateChips { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 8px; }
.dateChip { font-size: 11px; }
.poomWrap { margin-top: 12px; }
.poomDateRow { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.poomDateRow:first-child { margin-top: 6px; }
.poomLines { margin-top: 9px; padding: 12px; border: 1px solid var(--bd); border-radius: 3px; background: var(--soft); }
.poomLine { margin-top: 7px; font-size: 13px; line-height: 1.75; }
.poomLine:first-child { margin-top: 0; }
.poomTag { display: inline-flex; align-items: center; padding: 1px 6px; margin-right: 7px; border: 1px solid var(--bd2); border-radius: 2px; background: #fff; color: #526159; font-size: 10px; vertical-align: middle; }
.poomTag.singer, .poomTag.inst { color: var(--accent); border-color: #cad9ce; }
.poomText { vertical-align: middle; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.divider { height: 1px; margin: 16px 0; background: var(--bd); }

.ac { display: none; position: absolute; top: calc(100% + 7px); left: 0; right: 0; z-index: 200; overflow: hidden; border: 1px solid var(--bd2); border-radius: 4px; background: #fff; box-shadow: 0 8px 18px #16231b12; }
.acHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--bd); background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 500; }
.acBody { max-height: 300px; overflow-y: auto; overscroll-behavior: contain; }
.acRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 15px; border-bottom: 1px solid #edf0ed; background: #fff; font-size: 14px; line-height: 1.5; cursor: pointer; }
.acRow:last-child { border-bottom: 0; }
.acRow:hover, .acRow.active { background: var(--accentSoft2); color: var(--accent); }
mark { padding: 0 1px; background: #e0eee3; color: #214c32; border-radius: 1px; }

.calTop { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.calMonth { display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 600; }
.calGrid { overflow: hidden; margin-top: 20px; border: 1px solid var(--bd); border-radius: 4px; background: #fff; }
.calWeekHead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--bd); background: var(--soft); }
.calWeekHead div { padding: 11px 8px; color: var(--muted); font-size: 11px; text-align: center; }
.calCells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.calCell { position: relative; min-height: 132px; padding: 11px; overflow: hidden; border-right: 1px solid var(--bd); border-bottom: 1px solid var(--bd); background: #fff; cursor: pointer; }
.calCell:nth-child(7n) { border-right: 0; }
.calCell:hover { background: #f6f9f6; }
.calCell.dim { background: #fafbfa; color: #acb3ad; }
.calDayRow { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
.calDayNum { color: #526158; font-size: 12px; font-weight: 500; }
.calCell.dim .calDayNum { color: #adb5af; }
.calTodayDot { display: none; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.calCell.today .calTodayDot { display: block; }
.calCell.today .calDayNum { color: var(--accent); font-weight: 700; }
.calEvents { display: flex; flex-direction: column; gap: 5px; }
.calChip { max-width: 100%; overflow: hidden; padding: 5px 6px; background: var(--accentSoft2); color: var(--accent); border: 1px solid #e2ece5; border-radius: 2px; font-size: 11px; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; }
.calMore { width: fit-content; padding: 3px 5px; color: var(--muted); font-size: 10px; }
.calDots { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding-top: 3px; }
.calDot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.calPlus { color: var(--muted); font-size: 9px; line-height: 1.2; }

.modalDim { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 24px; background: #16211ccc; }
.modalDim.show { display: flex; }
.modal { width: 100%; max-width: 700px; max-height: calc(100dvh - 48px); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #d6dfd8; border-radius: 5px; background: #fff; }
.modalHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px; border-bottom: 1px solid var(--bd); background: #fff; }
.modalTitle { color: var(--fg); font-size: 18px; font-weight: 650; line-height: 1.4; }
.modalBody { min-height: 0; max-height: 65vh; overflow-y: auto; overscroll-behavior: contain; padding: 24px; color: var(--fg); font-size: 14px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
.modalActions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 14px 24px; border-top: 1px solid var(--bd); background: #fafbfa; }

@media (min-width: 768px) {
  #filterCard { display: flex; align-items: center; gap: 18px; }
  #filterCard .panelHead { flex: 0 0 auto; gap: 8px; }
  #filterCard .filterRow { flex: 1 1 auto; margin-top: 0 !important; }
}

@media (max-width: 1050px) {
  .wrap { padding-left: 24px; padding-right: 24px; }
  .topbarInner, .navInner { padding-left: 24px; padding-right: 24px; }
  .grid { gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
  .item { padding-left: 15px; padding-right: 15px; gap: 12px; }
  #songs .item { align-items: flex-start; flex-wrap: wrap; gap: 5px 10px; }
  #songs .item > :first-child { flex: 1 1 165px; }
  #songs .item > .chip { padding-top: 3px; }
}

@media (max-width: 767px) {
  html { scroll-padding-top: 82px; }
  body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  .topbar { height: calc(70px + env(safe-area-inset-top)); }
  .topbarInner { height: 70px; padding: 0 20px; gap: 12px; }
  .brandTitle { font-size: 15px; }
  .brandSub { font-size: 10px; }
  .brand { gap: 10px; }
  .brandMark { width: 31px; height: 31px; font-size: 19px; }
  .topStatus { gap: 6px; font-size: 10px; }
  .wrap { padding: 29px 20px 18px; }
  .workspaceIntro { padding-right: 0; margin-bottom: 23px; }
  .workspaceIntro h1 { font-size: 29px; letter-spacing: -1.2px; }
  .workspaceIntro p { margin-top: 9px; font-size: 12px; line-height: 1.8; }
  .eyebrow { font-size: 9px; letter-spacing: 1.4px; margin-bottom: 7px; }
  .workspaceIntro .eyebrow { margin: 0 0 7px; font-size: 9px; }
  .workspaceMeta { position: static; text-align: left; margin-top: 11px; font-size: 10px; }
  .nav { inset: auto 0 0; height: calc(var(--navH) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-bottom: 0; border-top: 1px solid var(--bd); }
  .navInner { padding: 0 10px; gap: 0; align-items: stretch; }
  .navBtn { flex: 1 1 0; min-width: 0; flex-direction: column; gap: 5px; padding: 10px 4px 8px; border-bottom: 0; border-top: 2px solid transparent; font-size: 10px; }
  .navBtn.active { border-top-color: var(--accent); border-bottom-color: transparent; }
  .navIcon { width: 19px; height: 19px; }
  .card { padding: 18px; margin: 20px 0; border-radius: 4px; }
  .searchHero { padding: 18px 18px 15px; }
  input[type="text"] { height: 50px; font-size: 16px; padding-left: 13px; }
  input[type="text"]::placeholder { font-size: 14px; }
  #filterCard { margin: 18px 0 20px; }
  .filterRow { gap: 8px; }
  .filterLeft { gap: 7px; }
  .filterLeft .miniBtn { flex: 1 1 auto; padding: 8px 10px; }
  .filterLeft select { flex: 1 1 auto; }
  .filterRight { width: 100%; }
  .miniBtn, .btn, select { min-height: 40px; }
  .clearBtn { min-height: 34px; right: 7px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 20px; }

function updateSelectionHeader(){

document.addEventListener('keydown',e=>{
  const modal=document.querySelector('.modalDim.show');
  if(!modal)return;
  if(e.key==='Escape'){closeNoticeModal();closeCalendarModal();return;}
  if(e.key==='Tab'){
    const nodes=[...modal.querySelectorAll('button,a[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!nodes.length)return;
    if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}
  }
});

// ============================================================
// 설정
// ============================================================
const FIXED_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1fyGPILf7sxYSBLx1gq7hFeZwV0enO0F3ufh-9DmbJp0/edit?gid=1851883768#gid=1851883768';
const FIXED_GID = '1851883768';
const FIXED_SHEET_NAME = 'DB';
const META_SHEET_NAME = 'META';
const META_GID = '';

const SETLIST_TABS = [
  { key: "sunday",      title: "주일 콘티",           sheet: "주일콘티" },
  { key: "winter2026",  title: "2026 겨울수련회 콘티", sheet: "2026겨울수련회콘티" },
  { key: "summer2026",  title: "2026 여름수련회 콘티", sheet: "2026여름수련회콘티" },
];

const NOTICE_SHEET_NAME   = "공지사항";
const CALENDAR_SHEET_NAME = "캘린더";

const KST_TZ           = "Asia/Seoul";
const KST_OFFSET_HOURS = 9;

const CACHE_TTL = 10 * 60 * 1000;
const CACHE_PREFIX = "shekinah_v2_";

// ============================================================
// 캐시 유틸
// ============================================================
function saveCache(key, data) {
  try {
    localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ ts: Date.now(), data }));
  } catch(e) {}
}

function loadCache(key, opts = {}) {
  const allowStale = !!opts.allowStale;

  try {
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    if (!raw) return null;

    const obj = JSON.parse(raw);
    if (!obj || typeof obj.ts !== "number" || !("data" in obj)) return null;

    if (!allowStale && Date.now() - obj.ts > CACHE_TTL) return null;

    return obj.data;
  } catch(e) {
    return null;
  }
}

function clearCache() {
  try {
    Object.keys(localStorage)
      .filter(k => k.startsWith(CACHE_PREFIX))
      .forEach(k => localStorage.removeItem(k));
  } catch(e) {}
}

// ============================================================
// 유틸 함수
// ============================================================
function norm(s){ return (s??"").toString().replace(/[\s\u200B\u200C\u200D\uFEFF]+/g,"").toLowerCase(); }
const trim = s => (s??"").toString().trim();

function pad2(n){ return String(n).padStart(2,"0"); }

function dateObjToYmdLocal(dt){
  if(!(dt instanceof Date) || Number.isNaN(dt.getTime())) return "";
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
}

function nowKSTParts(){
  const now = new Date();
  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:KST_TZ,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23",
  }).formatToParts(now);

  const map = {};
  for(const p of parts) if(p.type!=="literal") map[p.type]=p.value;

  return {
    y:parseInt(map.year,10),
    m:parseInt(map.month,10),
    d:parseInt(map.day,10),
    hh:parseInt(map.hour,10),
    mm:parseInt(map.minute,10),
    ss:parseInt(map.second,10)
  };
}

function nowKSTTs(){
  const p = nowKSTParts();
  return Date.UTC(p.y, p.m-1, p.d, p.hh - KST_OFFSET_HOURS, p.mm, p.ss);
}

function fmtYmdKST(ts){
  if(!ts) return "";
  return new Intl.DateTimeFormat("en-CA",{
    timeZone:KST_TZ,
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(new Date(ts));
}

function normDateStr(d){
  if(d instanceof Date) return dateObjToYmdLocal(d);

  const s = trim((d??"").toString());
  if(!s) return "";

  let m = s.match(/^(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  m = s.match(/Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/i);
  if(m){
    const y=m[1];
    const mm=String(parseInt(m[2],10)+1).padStart(2,"0");
    const dd=String(parseInt(m[3],10)).padStart(2,"0");
    return `${y}-${mm}-${dd}`;
  }

  m = s.match(/^(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/);
  if(m) return `${m[1]}-${String(parseInt(m[2],10)).padStart(2,"0")}-${String(parseInt(m[3],10)).padStart(2,"0")}`;

  m = s.match(/^(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;

  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

  if(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i.test(s)){
    const dt = new Date(s);
    if(!Number.isNaN(dt.getTime())) return dateObjToYmdLocal(dt);
  }

  return s;
}

function toDateTs(v){
  const s = normDateStr(v);
  if(!s) return null;

  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const [y,mo,d] = s.split("-").map(n=>parseInt(n,10));
    const ts = Date.UTC(y, mo-1, d, -KST_OFFSET_HOURS, 0, 0);
    return Number.isFinite(ts)?ts:null;
  }

  return null;
}

function escapeHTML(s){
  return (s??"").toString()
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function highlight(text, queryNorm){
  if(!queryNorm) return escapeHTML(text);

  const raw=(text??"").toString();
  const rawNS=raw.replace(/[\s\u200B\u200C\u200D\uFEFF]+/g,"");
  const idx=rawNS.toLowerCase().indexOf(queryNorm);

  if(idx<0) return escapeHTML(raw);

  let start=-1,end=-1,count=0;

  for(let i=0;i<raw.length;i++){
    const ch=raw[i];
    if(/[\s\u200B\u200C\u200D\uFEFF]/.test(ch)) continue;

    if(count===idx) start=i;
    if(count===idx+queryNorm.length-1){
      end=i;
      break;
    }
    count++;
  }

  if(start<0||end<0) return escapeHTML(raw);

  return escapeHTML(raw.slice(0,start))+
    "<mark>"+escapeHTML(raw.slice(start,end+1))+"</mark>"+
    escapeHTML(raw.slice(end+1));
}

function uniqueBy(arr,keyFn){
  const seen=new Set(), out=[];
  for(const x of arr){
    const k=keyFn(x);
    if(seen.has(k)) continue;
    seen.add(k);
    out.push(x);
  }
  return out;
}

function extractSheetId(url){
  const m=url.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  return m?m[1]:null;
}

function parseLabeledLinks(cellText,defaultLabel){
  const lines=(cellText??"").toString().split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out=[];

  for(const line of lines){
    const m=line.match(/(https?:\/\/\S+)/i);
    if(!m) continue;

    const url=m[1].trim();
    const label=line.replace(url,"").trim()||defaultLabel;
    out.push({label,url});
  }

  return out;
}

function extractFirstUrl(text){
  const m=(text??"").toString().match(/https?:\/\/\S+/i);
  return m?m[0].trim():"";
}

let _gvizIdx = 0;

function withGvizResponseHandler(rawUrl, cbName){
  const u = new URL(rawUrl, window.location.href);
  const tqxRaw = u.searchParams.get("tqx") || "";

  const parts = tqxRaw
    .split(";")
    .map(s => s.trim())
    .filter(Boolean)
    .filter(p => !p.toLowerCase().startsWith("responsehandler:"));

  if(!parts.some(p => p.toLowerCase().startsWith("out:"))){
    parts.unshift("out:json");
  }

  parts.push("responseHandler:" + cbName);
  u.searchParams.set("tqx", parts.join(";"));
  return u.toString();
}

function gvizCellToString(c){
  if(!c) return "";

  const v = c.v;

  if(v !== null && v !== undefined){
    if(v instanceof Date && !Number.isNaN(v.getTime())){
      return dateObjToYmdLocal(v);
    }
    return String(v);
  }

  if(c.f !== null && c.f !== undefined){
    return String(c.f);
  }

  return "";
}

function loadGvizJSONP(url){
  return new Promise((resolve,reject)=>{
    const cbName = "__gviz_cb_" + Date.now().toString(36) + "_" + (++_gvizIdx);
    let script = null;
    let settled = false;

    const timeout = setTimeout(()=>{
      fail(new Error("타임아웃: GVIZ 응답 없음"));
    }, 15000);

    function cleanup(){
      clearTimeout(timeout);

      try{ delete window[cbName]; }
      catch(e){ window[cbName] = undefined; }

      if(script && script.parentNode){
        script.parentNode.removeChild(script);
      }
    }

    function ok(data){
      if(settled) return;
      settled = true;
      cleanup();
      resolve(data);
    }

    function fail(err){
      if(settled) return;
      settled = true;
      cleanup();
      reject(err);
    }

    window[cbName] = payload => {
      try{
        if(payload && payload.status && payload.status !== "ok"){
          const msg = payload.errors && payload.errors.length
            ? payload.errors.map(e => e.message || e.detailed_message || JSON.stringify(e)).join(" / ")
            : "GVIZ status=" + payload.status;

          fail(new Error(msg));
          return;
        }

        const table = payload && payload.table;
        if(!table) throw new Error("GVIZ table 없음");

        const cols = (table.cols || []).map(c => trim(c.label || ""));

        const rows = (table.rows || []).map(r => {
          const cells = (r && r.c) || [];
          const len = Math.max(cols.length, cells.length);
          const out = [];

          for(let i=0;i<len;i++){
            out.push(gvizCellToString(cells[i]));
          }

          return out;
        });

        ok({ cols, rows });
      }catch(e){
        fail(new Error("파싱 실패: " + e.message));
      }
    };

    script = document.createElement("script");
    script.src = withGvizResponseHandler(url, cbName);
    script.onerror = () => fail(new Error("스크립트 로드 실패"));
    document.head.appendChild(script);
  });
}

function findCol(headerNorm,candidates){
  for(const c of candidates){
    const i=headerNorm.findIndex(h=>h===c);
    if(i>=0) return i;
  }

  for(const c of candidates){
    const i=headerNorm.findIndex(h=>h.includes(c));
    if(i>=0) return i;
  }

  return -1;
}

function toDBWithHeaderRecovery(cols,rows){
  const songKeys=["곡명","노래","노래제목","제목","song","title","name"].map(norm);
  const partKeys=["파트악기","파트","악기","instrument","part","세션"].map(norm);
  const personKeys=["담당자","담당","연주자","멤버","이름","person","member"].map(norm);
  const dateKeys=["등록일","날짜","일자","date","when","time","일시"].map(norm);
  const scoreKeys=["악보url","악보","score","sheet","chord","악보링크"].map(norm);
  const videoKeys=["영상url","영상","video","youtube","유튜브"].map(norm);
  const poomKeys=["송품","메모","노트","note","memo","주의","주의사항","유의사항","warn","warning"].map(norm);

  let header=cols.map(h=>norm(h));
  let dataRows=rows;

  let idxSong=findCol(header,songKeys);
  let idxPart=findCol(header,partKeys);
  let idxPerson=findCol(header,personKeys);
  let idxDate=findCol(header,dateKeys);
  let idxScore=findCol(header,scoreKeys);
  let idxVideo=findCol(header,videoKeys);
  let idxPoom=findCol(header,poomKeys);

  const labelsBad=header.every(h=>!h||/^[a-z]$/.test(h));

  if((idxSong<0||idxPart<0||idxPerson<0)&&dataRows.length&&labelsBad){
    const firstRowHeader=dataRows[0].map(v=>norm(v));
    const s2=findCol(firstRowHeader,songKeys);
    const p2=findCol(firstRowHeader,partKeys);
    const m2=findCol(firstRowHeader,personKeys);

    if(s2>=0&&p2>=0&&m2>=0){
      header=firstRowHeader;
      idxSong=s2;
      idxPart=p2;
      idxPerson=m2;
      idxDate=findCol(firstRowHeader,dateKeys);
      idxScore=findCol(firstRowHeader,scoreKeys);
      idxVideo=findCol(firstRowHeader,videoKeys);
      idxPoom=findCol(firstRowHeader,poomKeys);
      dataRows=dataRows.slice(1);
    }
  }

  if(idxSong<0||idxPart<0||idxPerson<0){
    const seenCols=cols.filter(Boolean).slice(0,12).join(", ")||"(빈 헤더)";
    const seenRow1=(rows[0]?rows[0].slice(0,12).join(", "):"(첫행 없음)");
    throw new Error("컬럼 매칭 실패\n헤더: "+seenCols+"\n첫 행: "+seenRow1);
  }

  const out=[];

  for(const r of dataRows){
    const song=trim(r[idxSong]??"");
    const part=trim(r[idxPart]??"");
    const person=trim(r[idxPerson]??"");

    if(!song||!part) continue;

    const date=(idxDate>=0)?trim(r[idxDate]??""):"";
    const scoreUrl=(idxScore>=0)?trim(r[idxScore]??""):"";
    const videoUrl=(idxVideo>=0)?trim(r[idxVideo]??""):"";
    const songPoom=(idxPoom>=0)?trim(r[idxPoom]??""):"";

    out.push({
      song,part,person,date,scoreUrl,videoUrl,songPoom,
      songKey:norm(song),
      partKey:norm(part),
      personKey:norm(person)
    });
  }

  return out;
}

function toMetaMapWithHeaderRecovery(cols,rows){
  const songKeys=["곡명","노래","노래제목","제목","song","title","name"].map(norm);
  const scoreKeys=["악보url","악보","score","sheet","chord","악보링크"].map(norm);
  const noteKeys=["메모","노트","note","memo","콘티메모","콘티","송품"].map(norm);
  const warnKeys=["주의사항","주의","warn","warning","주의점","유의사항"].map(norm);
  const linkKeys=["링크","url","영상","youtube","참고","reference"].map(norm);

  const colLabels=cols.map(h=>norm(h));

  let idxSong=findCol(colLabels,songKeys);
  let idxScore=findCol(colLabels,scoreKeys);
  let idxNote=findCol(colLabels,noteKeys);
  let idxWarn=findCol(colLabels,warnKeys);
  let idxLink=findCol(colLabels,linkKeys);
  let startRow=0;

  const labelsBad=colLabels.every(h=>!h||/^[a-z]$/.test(h));

  if(idxSong<0&&rows&&rows.length&&labelsBad){
    const first=rows[0].map(v=>norm(v));
    const s2=findCol(first,songKeys);

    if(s2>=0){
      idxSong=s2;
      idxScore=findCol(first,scoreKeys);
      idxNote=findCol(first,noteKeys);
      idxWarn=findCol(first,warnKeys);
      idxLink=findCol(first,linkKeys);
      startRow=1;
    }
  }

  const m=new Map();

  for(let i=startRow;i<rows.length;i++){
    const r=rows[i];
    const song=trim(r[idxSong]);

    if(!song) continue;

    const key=norm(song);
    const scoreUrl=idxScore>=0?trim(r[idxScore]):"";
    const linkUrl =idxLink >=0?trim(r[idxLink]) :"";
    const note    =idxNote >=0?trim(r[idxNote]) :"";
    const warn    =idxWarn >=0?trim(r[idxWarn]) :"";

    const prev=m.get(key)||{song,scoreUrl:"",linkUrl:"",note:"",warn:""};

    m.set(key,{
      song:prev.song||song,
      scoreUrl:prev.scoreUrl||scoreUrl,
      linkUrl:prev.linkUrl||linkUrl,
      note:prev.note||note,
      warn:prev.warn||warn
    });
  }

  return m;
}

function rebuildSongs(){
  SONGS=uniqueBy(DB,r=>r.songKey).map(r=>r.song).sort((a,b)=>a.localeCompare(b,"ko"));
}

function buildSongInfo(){
  SONG_INFO=new Map();

  for(const r of DB){
    const sk=r.songKey;

    if(!SONG_INFO.has(sk)){
      SONG_INFO.set(sk,{
        song:r.song,
        lastTs:null,
        totalCount:0,
        tsSet:new Set(),
        tsList:[]
      });
    }

    const it=SONG_INFO.get(sk);
    it.song=it.song||r.song;
    it.totalCount+=1;

    const ts=toDateTs(r.date);

    if(ts){
      it.tsSet.add(ts);
      if(!it.lastTs||ts>it.lastTs) it.lastTs=ts;
    }
  }

  for(const it of SONG_INFO.values()){
    it.tsList=Array.from(it.tsSet).sort((a,b)=>a-b);
    delete it.tsSet;
  }
}

function cutoffTsByWeeks(weeks){
  return nowKSTTs()-weeks*7*24*60*60*1000;
}

function countInWindow(tsList,cutoffTs){
  let lo=0,hi=tsList.length;

  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(tsList[mid]<cutoffTs) lo=mid+1;
    else hi=mid;
  }

  return tsList.length-lo;
}

function getFilteredSongKeys(){
  const cutoff=cutoffTsByWeeks(FILTER.weeks);
  let keys=[], noDateCount=0;

  for(const [sk,info] of SONG_INFO.entries()){
    const hasDate=!!info.lastTs;

    if(!hasDate){
      noDateCount+=1;
      keys.push(sk);
      continue;
    }

    if(FILTER.mode==="recent"){
      if(countInWindow(info.tsList,cutoff)>=1) keys.push(sk);
    }
    else if(FILTER.mode==="frequent"){
      if(countInWindow(info.tsList,cutoff)>=FREQUENT_MIN_COUNT) keys.push(sk);
    }
    else if(FILTER.mode==="old"){
      if(info.lastTs<cutoff) keys.push(sk);
    }
  }

  elNoDateChip.textContent="날짜없음 "+noDateCount;
  elNoDateChip.style.display=noDateCount?"inline-block":"none";

  return keys;
}

function getFilteredSongs(){
  const keys=getFilteredSongKeys();

  const list=keys.map(sk=>{
    const info=SONG_INFO.get(sk);
    return {songKey:sk,song:info?.song||"",info};
  });

  const cutoff=cutoffTsByWeeks(FILTER.weeks);

  if(FILTER.sort==="az"){
    list.sort((a,b)=>a.song.localeCompare(b.song,"ko"));
  }
  else {
    if(FILTER.mode==="recent"){
      list.sort((a,b)=>(b.info.lastTs||0)-(a.info.lastTs||0));
    }
    else if(FILTER.mode==="frequent"){
      list.sort((a,b)=>{
        const ca=countInWindow(a.info.tsList,cutoff);
        const cb=countInWindow(b.info.tsList,cutoff);

        return cb!==ca?cb-ca:(b.info.lastTs||0)-(a.info.lastTs||0);
      });
    }
    else if(FILTER.mode==="old"){
      list.sort((a,b)=>{
        const ta=a.info.lastTs===null?Infinity:a.info.lastTs;
        const tb=b.info.lastTs===null?Infinity:b.info.lastTs;

        return ta-tb;
      });
    }
  }

  return list;
}

function renderMediaForExactSong(exactRows){
  if(!exactRows||!exactRows.length){
    hideMediaBox();
    return;
  }

  const qn=norm(elQ.value);
  const meta=META.get(qn);

  const scoreMap=new Map(), videoMap=new Map();

  const addScore=(l,u)=>{
    const k=l+"||"+u;
    if(!scoreMap.has(k)) scoreMap.set(k,{label:l,url:u});
  };

  const addVideo=(l,u)=>{
    const k=l+"||"+u;
    if(!videoMap.has(k)) videoMap.set(k,{label:l,url:u});
  };

  exactRows.forEach(r=>{
    parseLabeledLinks(r.scoreUrl,"악보").forEach(({label,url})=>addScore(label,url));
    parseLabeledLinks(r.videoUrl,"영상").forEach(({label,url})=>addVideo(label,url));
  });

  if(meta){
    parseLabeledLinks(meta.scoreUrl,"악보").forEach(({label,url})=>addScore(label,url));
    parseLabeledLinks(meta.linkUrl,"영상").forEach(({label,url})=>addVideo(label,url));
  }

  const scores=[...scoreMap.values()];
  const videos=[...videoMap.values()];

  LAST_MEDIA={
    scores:new Set(scores.map(x=>x.url)),
    videos:new Set(videos.map(x=>x.url))

function formatPoomTextToHTML(text){
  const lines=(text??"").toString().split(/\r?\n/);

  return lines.map(line=>{
    const t=line.trim();

    if(!t) return "";

    let m=t.match(/^(싱어|보컬|vocal)\s*[:：]\s*(.*)$/i);
    if(m){
      return `<div class="poomLine"><span class="poomTag singer">${escapeHTML(m[1])}</span><span class="poomText">${escapeHTML(m[2]??"")}</span></div>`;
    }

    m=t.match(/^(악기|연주|band|inst|instrument)\s*[:：]\s*(.*)$/i);
    if(m){
      return `<div class="poomLine"><span class="poomTag inst">${escapeHTML(m[1])}</span><span class="poomText">${escapeHTML(m[2]??"")}</span></div>`;
    }

    return `<div class="poomLine"><span class="poomText">${escapeHTML(t)}</span></div>`;
  }).join("");
}

function poomSortDates(dates){
  return dates.slice().sort((a,b)=>{
    if(a==="날짜 없음") return 1;
    if(b==="날짜 없음") return -1;
    return b.localeCompare(a);
  });
}

function renderPoomTabs(){
  elPoomDateTabs.innerHTML="";

  const makeBtn=(label,value)=>{
    const b=document.createElement("button");
    b.type="button";

function renderPoomBody(){

  const sel=POOM_STATE.selectedDate;
  const dates=POOM_STATE.dates;

  const renderOneDate=(d)=>{
    const set=POOM_STATE.byDate.get(d);

    if(!notes.length) return;

    const dateRow=document.createElement("div");
    dateRow.className="poomDateRow";

    if(!elPoomByDate.innerHTML){
      elPoomByDate.innerHTML=`<div class="empty">내용 없음</div>`;
    }

    return;

    return;
  }

  dates.forEach(renderOneDate);
}

function renderPoomForExactSong(exactRows){
  const qn=norm(elQ.value);

  if(!qn||!exactRows||!exactRows.length){
    hideMetaBox();
    return;
  }

  if(POOM_STATE.lastSongKey!==qn){
    POOM_STATE.lastSongKey=qn;
    POOM_STATE.selectedDate="__all__";
  }

  const byDate=new Map();

  for(const r of exactRows){
    const poom=trim(r.songPoom);
    if(!poom) continue;

    const d=normDateStr(r.date)||"날짜 없음";

    if(!byDate.has(d)) byDate.set(d,new Set());
    byDate.get(d).add(poom);
  }

  const dates=poomSortDates(Array.from(byDate.keys()));
  const meta=META.get(qn);
  const commonBlocks=[];

  if(meta){
    if(trim(meta.note)) commonBlocks.push(trim(meta.note));
    if(trim(meta.warn)) commonBlocks.push(trim(meta.warn));
  }

  const hasAny=byDate.size>0||commonBlocks.length>0||(meta&&(trim(meta.scoreUrl)||trim(meta.linkUrl)));

  if(!hasAny){
    hideMetaBox();
    return;
  }

  POOM_STATE.byDate=byDate;
  POOM_STATE.dates=dates;

  if(POOM_STATE.selectedDate!=="__all__"&&!byDate.has(POOM_STATE.selectedDate)){
    POOM_STATE.selectedDate="__all__";
  }

  elMetaBox.style.display="block";
  elMetaSong.textContent=meta?.song||elQ.value;

  if(meta){
    const sOne=extractFirstUrl(trim(meta.scoreUrl));
    const lOne=extractFirstUrl(trim(meta.linkUrl));

    if(sOne&&!LAST_MEDIA.scores.has(sOne)){
      elMetaScoreBtn.href=sOne;
      elMetaScoreBtn.style.display="inline-flex";
    } else {
      elMetaScoreBtn.style.display="none";
    }

    if(lOne&&!LAST_MEDIA.videos.has(lOne)){
      elMetaLinkBtn.href=lOne;
      elMetaLinkBtn.style.display="inline-flex";
    } else {
      elMetaLinkBtn.style.display="none";
    }
  } else {
    elMetaScoreBtn.style.display="none";
    elMetaLinkBtn.style.display="none";
  }

  renderPoomTabs();
  renderPoomBody();

  if(commonBlocks.length){
    elPoomCommon.textContent=commonBlocks.join("\n\n");
    elPoomCommon.style.display="block";
  } else {
    elPoomCommon.textContent="";
    elPoomCommon.style.display="none";
  }
}

function renderResults(){
  const qn=norm(elQ.value);

  if(!qn){
    elResultsTable.style.display="none";

    elResultsEmpty.textContent="선택한 곡 없음";
    elResults.innerHTML="";

    return;
  }

  const matches=DB.filter(r=>r.songKey.includes(qn));
  const exact=matches.filter(r=>r.songKey===qn);
  const picked=exact.length?exact:matches;

  if(exact.length){
    renderMediaForExactSong(exact);
    renderPoomForExactSong(exact);
  } else {
    hideMediaBox();
    hideMetaBox();
  }

  const group=new Map();

  for(const r of picked){
    const k=`${r.partKey}||${r.personKey}`;

    if(!group.has(k)){
      group.set(k,{
        part:r.part,
        person:r.person,
        dates:new Set()
      });
    }

    const nd=normDateStr(r.date);
    if(nd) group.get(k).dates.add(nd);
  }

  const rows=[...group.values()].sort((a,b)=>a.part.localeCompare(b.part,"ko"));
  elResults.innerHTML="";

  if(!rows.length){
    elResultsTable.style.display="none";
    elResultsEmpty.style.display="block";
    elResultsEmpty.textContent="결과 없음";
    return;
  }

  elResultsEmpty.style.display="none";
  elResultsTable.style.display="table";

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const td1=document.createElement("td");
    td1.textContent=r.part;

    const td2=document.createElement("td");
    const name=document.createElement(r.person?"button":"span");

    if(r.person){name.type="button";name.addEventListener("click",()=>openPersonPanel(r.person));}

      wrap.className="dateChips";

      dates.forEach(d=>{
        const chip=document.createElement("span");

        chip.textContent=d;
        wrap.appendChild(chip);
      });

    }

    tr.appendChild(td1);
    tr.appendChild(td2);

let acItems=[], acIndex=-1;
let suppressNextACOpen = false;

function focusQWithoutAC(){
  suppressNextACOpen = true;

  try{
    elQ.focus({ preventScroll:true });
  }catch(e){
    elQ.focus();
  }

  setTimeout(()=>{
    suppressNextACOpen = false;
  }, 80);
}

function openAC(){
  if(!acItems.length) return closeAC();

  const rect = elQ.getBoundingClientRect();
  const isMobile = window.innerWidth < 900;

  if(isMobile){
    elAC.style.position = "fixed";
    elAC.style.top = (rect.bottom + 8) + "px";
    elAC.style.left = rect.left + "px";
    elAC.style.right = (window.innerWidth - rect.right) + "px";
    elAC.style.width = "auto";

    const maxH = Math.max(
      120,
      Math.min(260, window.innerHeight - rect.bottom - 18)
    );

    elACBody.style.maxHeight = maxH + "px";
  }else{
    elAC.style.position = "absolute";
    elAC.style.top = "";
    elAC.style.left = "";
    elAC.style.right = "";
    elAC.style.width = "";
    elACBody.style.maxHeight = "260px";
  }

  elAC.style.display = "block";
  elAC.setAttribute("aria-hidden","false");
}

function closeAC(){
  elAC.style.display="none";
  elAC.setAttribute("aria-hidden","true");
  acIndex=-1;
}

function repositionAC(){
  if(elAC.style.display === "block"){
    openAC();
  }
}

window.addEventListener("resize", repositionAC);
window.addEventListener("scroll", repositionAC, true);

function scrollACIntoView(){
  const rows=elACBody.querySelectorAll(".acRow");
  const row=rows[acIndex];

  if(!row) return;

  const top=row.offsetTop;
  const bottom=top+row.offsetHeight;

  if(top<elACBody.scrollTop) elACBody.scrollTop=top;
  else if(bottom>elACBody.scrollTop+elACBody.clientHeight) elACBody.scrollTop=bottom-elACBody.clientHeight;
}

function chooseAC(i){
  const item=acItems[i];
  if(!item) return;

  elQ.value=item;
  renderSearchView({showAC:false});
  focusQWithoutAC();
}

function renderAC(){
  const qn=norm(elQ.value);

  if(!qn){
    closeAC();
    elACBody.innerHTML="";
    elACMeta.textContent="0";
    return;
  }

  acItems=SONGS.filter(s=>norm(s).includes(qn)).slice(0,10);
  elACMeta.textContent=String(acItems.length);

  if(!acItems.length) return closeAC();

  openAC();
  elACBody.innerHTML="";

  acItems.forEach((song,idx)=>{
    const row=document.createElement("div");
    row.className="acRow"+(idx===acIndex?" active":"");
    row.innerHTML=`<span>${highlight(song,qn)}</span><span class="chip">Enter</span>`;
    row.addEventListener("mousedown",(e)=>{
      e.preventDefault();
      chooseAC(idx);
    });
    elACBody.appendChild(row);
  });
}

function stepAC(dir){
  if(elAC.style.display!=="block") return;
  if(!acItems.length) return;

  acIndex=acIndex+dir;

  if(acIndex<0) acIndex=acItems.length-1;
  if(acIndex>=acItems.length) acIndex=0;

  elACBody.querySelectorAll(".acRow").forEach((r,i)=>r.classList.toggle("active",i===acIndex));
  scrollACIntoView();
}

// ============================================================
// 콘티
// ============================================================
function uniqSongs(arr){
  const seen=new Set(), out=[];

  for(const s of arr){
    const t=trim(s);

    if(!t) continue;

    const k=norm(t);

    if(seen.has(k)) continue;

    seen.add(k);
    out.push(t);
  }

  return out;
}

function isHeaderRowForDays(row){
  return (row || [])
    .map(v => norm(v))
    .some(h => /^\d+일차(곡명|노래|찬양|콘티)?$/.test(h));
}

const SONG_HEADER_KEYS = ["곡명","노래","노래제목","제목","song","title"].map(norm);

function isSongHeaderValue(s){
  return SONG_HEADER_KEYS.includes(norm(s));
}

function buildMultiDaySetlist(rows){
  rows = rows || [];

  if(rows.length < 1) return null;

  const headerRowIndex = rows.findIndex(r => isHeaderRowForDays(r));

  if(headerRowIndex < 0) return null;

  const header = (rows[headerRowIndex] || []).map(v => trim(v ?? ""));
  const headerN = header.map(v => norm(v));
  const dataRows = rows.slice(headerRowIndex + 1);

  const dayNums = Array.from(new Set(
    headerN
      .map(h => {
        const m = h.match(/^(\d+)일차/);
        return m ? parseInt(m[1], 10) : null;
      })
      .filter(n => Number.isFinite(n))
  )).sort((a,b)=>a-b);

  function idxOfDaySong(n){
    const day = norm(`${n}일차`);

    const exacts = [
      `${n}일차`,
      `${n}일차곡명`,
      `${n}일차노래`,
      `${n}일차찬양`,
      `${n}일차콘티`,
    ].map(norm);

    let idx = headerN.findIndex(h => exacts.includes(h));

    if(idx >= 0) return idx;

    return headerN.findIndex(h =>
      h.includes(day) && !/(악보|링크|url|영상)/i.test(h)
    );
  }

  function idxOfDayUrl(n){
    const day = norm(`${n}일차`);

    return headerN.findIndex(h =>
      h.includes(day) && /(악보|링크|url|영상)/i.test(h)
    );
  }

  const days = [];

  for(const n of dayNums){
    const songCol = idxOfDaySong(n);

    if(songCol < 0) continue;

    let scoreCol = idxOfDayUrl(n);

    if(scoreCol < 0 && songCol + 1 < headerN.length){
      scoreCol = songCol + 1;
    }

    const songsRaw = [];
    let url = "";

    for(const r of dataRows){
      const s = trim(r[songCol] ?? "");

      if(s && !isSongHeaderValue(s)){
        songsRaw.push(s);
      }

      if(!url && scoreCol >= 0){
        const u = extractFirstUrl(r[scoreCol] ?? "");
        if(u) url = u;
      }
    }

    const songs = uniqSongs(songsRaw);

    if(songs.length || url){
      days.push({
        id: `day${n}`,
        title: `${n}일차`,
        songs,
        url
      });
    }
  }

  if(!days.length) return null;

  return { type:"multi", days };
}

async function loadSetlistFromSheet(sheetName){
  const sheetId=extractSheetId(FIXED_SHEET_URL);
  const base="https://docs.google.com/spreadsheets/d/"+sheetId+"/gviz/tq?tqx=out:json";

  try{
    const urlWide =
      base +
      "&sheet=" + encodeURIComponent(sheetName) +
      "&headers=0" +
      "&tq=" + encodeURIComponent(
        "select A,B,C,D,E,F where A is not null or B is not null or C is not null or D is not null or E is not null or F is not null"
      );

    const pWide=await loadGvizJSONP(urlWide);
    const multi=buildMultiDaySetlist(pWide.rows||[]);

    if(multi) return multi;
  }catch(e){}

  const url=base+"&sheet="+encodeURIComponent(sheetName)+"&headers=1&tq="+encodeURIComponent("select A,B where A is not null or B is not null");
  const p=await loadGvizJSONP(url);

  const songsRaw = (p.rows || [])
    .map(r => trim(r[0] ?? ""))
    .filter(s => s && !isSongHeaderValue(s));

  const cleanedSongs=uniqSongs(songsRaw);

  let setlistUrl="";

  for(const r of (p.rows||[])){
    const u=extractFirstUrl(r[1]??"");
    if(u){
      setlistUrl=u;
      break;
    }
  }

  return {type:"single",songs:cleanedSongs,url:setlistUrl};
}

async function loadAllSetlists(){
  for(const def of SETLIST_TABS){

    if(cached){

    }

    try{
      const data=await loadSetlistFromSheet(def.sheet);
      SETLIST_CACHE.set(def.key,data);
      saveCache("sl_"+def.key,data);
    }catch(e){
      const stale=loadCache("sl_"+def.key, {allowStale:true});
      SETLIST_CACHE.set(def.key,stale||{type:"single",songs:[],url:""});
    }
  }
}

function isHeaderLikeNotice(n){
  const set=new Set([norm(n.title),norm(n.body),norm(n.link),norm(n.date)].filter(Boolean));

  return (set.has(norm("제목"))&&(set.has(norm("내용"))||set.has(norm("링크"))||set.has(norm("날짜"))))||
         (set.has(norm("날짜"))&&set.has(norm("제목")));
}

async function loadNoticesFromSheet(){
  const cached=loadCache("notices");

  if(cached) return cached;

  const sheetId=extractSheetId(FIXED_SHEET_URL);
  const base="https://docs.google.com/spreadsheets/d/"+sheetId+"/gviz/tq?tqx=out:json";
  const url=base+"&sheet="+encodeURIComponent(NOTICE_SHEET_NAME)+"&tq="+encodeURIComponent("select A,B,C,D where A is not null or B is not null or C is not null or D is not null");
  const p=await loadGvizJSONP(url);
  const cols=p.cols||[], rows=p.rows||[];

  const titleKeys=["제목","title","subject"].map(norm);
  const bodyKeys=["내용","body","text","message","공지내용"].map(norm);
  const linkKeys=["링크","url","link"].map(norm);
  const dateKeys=["날짜","일자","date","day"].map(norm);

  let header=cols.map(h=>norm(h));
  let idxTitle=findCol(header,titleKeys);
  let idxBody=findCol(header,bodyKeys);
  let idxLink=findCol(header,linkKeys);
  let idxDate=findCol(header,dateKeys);
  let startRow=0;

  const labelsBad=header.every(h=>!h||/^[a-z]$/.test(h));

  if((idxTitle<0||idxBody<0)&&rows.length&&labelsBad){
    const first=rows[0].map(v=>norm(v));
    const t2=findCol(first,titleKeys);
    const b2=findCol(first,bodyKeys);

    if(t2>=0&&b2>=0){
      idxTitle=t2;
      idxBody=b2;
      idxLink=findCol(first,linkKeys);
      idxDate=findCol(first,dateKeys);
      startRow=1;
    }
  }

  if(idxTitle<0) idxTitle=0;
  if(idxBody<0) idxBody=1;
  if(idxLink<0) idxLink=2;
  if(idxDate<0) idxDate=3;

  let list=[];

  for(let i=startRow;i<rows.length;i++){
    const r=rows[i]||[];

    const rawTitle=trim(r[idxTitle]??"");
    const rawBody=trim(r[idxBody]??"");
    const rawLink=trim(r[idxLink]??"");
    const rawDate=trim(r[idxDate]??"");

    if(!rawTitle&&!rawBody&&!rawLink&&!rawDate) continue;

    list.push({
      title:rawTitle,
      body:rawBody,
      link:rawLink,
      date:normDateStr(rawDate)
    });
  }

  list=list.filter(n=>!isHeaderLikeNotice(n));

  list.sort((a,b)=>{
    const ad=normDateStr(a.date),bd=normDateStr(b.date);

    if(ad&&bd) return bd.localeCompare(ad);
    if(ad&&!bd) return -1;
    if(!ad&&bd) return 1;

    return 0;
  });

  saveCache("notices",list);

  return list;
}

function buildCalendarIndex(){
  CAL_BY_DATE=new Map();

  for(const ev of CAL_CACHE){
    const d=normDateStr(ev.date);

    if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;

    if(!CAL_BY_DATE.has(d)) CAL_BY_DATE.set(d,[]);
    CAL_BY_DATE.get(d).push(ev);
  }
}

function daysInMonthUTC(y,m0){
  return new Date(Date.UTC(y,m0+1,0)).getUTCDate();
}

function weekdayIndexKST(y,m0,d){
  const dt=new Date(Date.UTC(y,m0,d,0,0,0));
  const w=new Intl.DateTimeFormat("en-US",{timeZone:KST_TZ,weekday:"short"}).format(dt);
  const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};

  return map[w]??0;
}

function ymd(y,m0,d){
  return `${y}-${String(m0+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

function renderCalendar(){
  const y=CAL_MONTH.y;
  const m0=CAL_MONTH.m;
  const mm=String(m0+1).padStart(2,"0");

  elCalMonthLabel.textContent=`${y}-${mm}`;

  const monthStart=`${y}-${mm}-01`;
  const monthEnd=`${y}-${mm}-${String(daysInMonthUTC(y,m0)).padStart(2,"0")}`;

  let cnt=0;

  for(const [d,arr] of CAL_BY_DATE.entries()){
    if(d>=monthStart&&d<=monthEnd) cnt+=arr.length;
  }

  elCalCount.textContent=String(cnt);
  elCalCells.innerHTML="";

  const firstW=weekdayIndexKST(y,m0,1);
  const dimPrevDays=firstW;
  const prevY=(m0===0)?(y-1):y;
  const prevM=(m0===0)?11:(m0-1);
  const prevLast=daysInMonthUTC(prevY,prevM);
  const curLast=daysInMonthUTC(y,m0);

  const today=(()=>{
    const p=nowKSTParts();
    return ymd(p.y,p.m-1,p.d);
  })();

  const mobile=isCalMobile();

  for(let i=0;i<42;i++){
    let cellY=y,cellM=m0,cellD=0,inMonth=true;

    const dayNum=i-dimPrevDays+1;

    if(dayNum<=0){
      inMonth=false;
      cellY=prevY;
      cellM=prevM;
      cellD=prevLast+dayNum;
    }
    else if(dayNum>curLast){
      inMonth=false;
      const nY=(m0===11)?(y+1):y;
      const nM=(m0===11)?0:(m0+1);
      cellY=nY;
      cellM=nM;
      cellD=dayNum-curLast;
    }
    else {
      cellD=dayNum;
    }

    const dKey=ymd(cellY,cellM,cellD);
    const evs=CAL_BY_DATE.get(dKey)||[];

    const cell=document.createElement("div");
    cell.className="calCell"+(inMonth?"":" dim")+(dKey===today?" today":"");
    cell.dataset.date=dKey;
    if(evs.length){cell.tabIndex=0;cell.setAttribute("role","button");cell.setAttribute("aria-label",dKey+" "+evs.length+"개 일정");cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCalendarDayModal(dKey,evs);}});}

    const top=document.createElement("div");
    top.className="calDayRow";
    top.innerHTML=`<span class="calDayNum">${cellD}</span><span class="calTodayDot" aria-hidden="true"></span>`;
    cell.appendChild(top);

    const eventsWrap=document.createElement("div");
    eventsWrap.className="calEvents";

    if(evs.length){
      if(mobile){
        const dots=document.createElement("div");
        dots.className="calDots";

        const showDots=Math.min(evs.length,6);

        for(let k=0;k<showDots;k++){
          const dot=document.createElement("span");
          dot.className="calDot";
          dot.setAttribute("aria-hidden","true");
          dots.appendChild(dot);
        }

        if(evs.length>6){
          const plus=document.createElement("span");
          plus.className="calPlus";
          plus.textContent=`+${evs.length-6}`;
          dots.appendChild(plus);
        }

        dots.title=evs.map(e=>(e.title||"일정")).slice(0,8).join(" / ");
        eventsWrap.appendChild(dots);
      }
      else {
        const maxShow=3;

        evs.slice(0,maxShow).forEach(ev=>{
          const chip=document.createElement("div");
          chip.className="calChip";
          chip.title=ev.title||"일정";
          chip.textContent=(ev.title||"일정").toString();

          chip.addEventListener("click",(e)=>{
            e.stopPropagation();
            openCalendarEventModal(ev,dKey);
          });

          eventsWrap.appendChild(chip);
        });

        if(evs.length>maxShow){
          const more=document.createElement("div");
          more.className="calMore";
          more.textContent=`+${evs.length-maxShow}`;
          eventsWrap.appendChild(more);
        }
      }
    }

    cell.appendChild(eventsWrap);

    cell.addEventListener("click",()=>{
      if(!evs.length) return;
      openCalendarDayModal(dKey,evs);
    });

    elCalCells.appendChild(cell);
  }
}

  const sheetId=extractSheetId(FIXED_SHEET_URL);

  if(!sheetId){
    setStatus("시트 ID 확인 필요",false,false);
    return;
  }

  const cachedDB = loadCache("db", { allowStale: !navigator.onLine });

  if(cachedDB){
    applyCachedDB(cachedDB);
    setTopStatus("저장된 자료",true);
  }

  if(!navigator.onLine){
    const cn = loadCache("notices", { allowStale:true });
    if(cn) NOTICE_CACHE = cn;

    const cc = loadCache("calendar", { allowStale:true });
    if(cc){
      CAL_CACHE = cc;
      buildCalendarIndex();
    }

    SETLIST_TABS.forEach(def=>{
      const cs = loadCache("sl_" + def.key, { allowStale:true });
      if(cs) SETLIST_CACHE.set(def.key, cs);
    });

    renderAllStaticViews();
    setStatus("오프라인 — 캐시 데이터 표시 중",true,false);
    return;
  }

  setStatus("불러오는 중…",true,true);

  const base="https://docs.google.com/spreadsheets/d/"+sheetId+"/gviz/tq?tqx=out:json";
  const urlBySheet=base+"&sheet="+encodeURIComponent(FIXED_SHEET_NAME);
  const urlByGid=base+"&gid="+encodeURIComponent(FIXED_GID);

  try{
    let cols,rows;

    try{
      const p=await loadGvizJSONP(urlBySheet);
      cols=p.cols;
      rows=p.rows;
    }
    catch(e1){
      const p=await loadGvizJSONP(urlByGid);
      cols=p.cols;
      rows=p.rows;
    }

    DB=toDBWithHeaderRecovery(cols,rows);
    rebuildSongs();
    buildSongInfo();

    try{
      const mp=await loadGvizJSONP(base+"&sheet="+encodeURIComponent(META_SHEET_NAME));
      META=toMetaMapWithHeaderRecovery(mp.cols,mp.rows);
    }
    catch(e){
      if(META_GID){
        try{
          const mp=await loadGvizJSONP(base+"&gid="+encodeURIComponent(META_GID));
          META=toMetaMapWithHeaderRecovery(mp.cols,mp.rows);
        }
        catch(e2){
          META=new Map();
        }
      } else {
        META=new Map();
      }
    }

    saveCache("db",{db:DB, meta:[...META.entries()]});
    elCacheStatusBadge.style.display="none";

    const [slRes,noticeRes,calRes]=await Promise.allSettled([
      loadAllSetlists(),
      loadNoticesFromSheet(),
      loadCalendarFromSheet(),
    ]);

    if(noticeRes.status==="fulfilled"){
      NOTICE_CACHE=noticeRes.value;
    } else {
      NOTICE_CACHE=loadCache("notices", {allowStale:true})||[];
    }

    if(calRes.status==="fulfilled"){
      CAL_CACHE=calRes.value;
    } else {
      CAL_CACHE=loadCache("calendar", {allowStale:true})||[];
    }

    buildCalendarIndex();

    elWeeksSel.value=String(FILTER.weeks);
    setFilterMode(FILTER.mode);

    renderSearchView({showAC:false});
    renderAllStaticViews();

    setStatus("연결됨",true,false);
  }
  catch(e){
    const staleDB=loadCache("db", {allowStale:true});

    if(staleDB){
      applyCachedDB(staleDB);

      NOTICE_CACHE=loadCache("notices", {allowStale:true})||NOTICE_CACHE||[];
      CAL_CACHE=loadCache("calendar", {allowStale:true})||CAL_CACHE||[];
      buildCalendarIndex();

      SETLIST_TABS.forEach(def=>{
        const cs=loadCache("sl_"+def.key, {allowStale:true});
        if(cs) SETLIST_CACHE.set(def.key, cs);
      });

      renderAllStaticViews();
      setStatus("연결 실패 — 캐시 데이터 표시 중\n"+e.message,true,false);
    } else {
      setStatus("연결 실패\n"+e.message,false,false);
    }
  }
}

// ============================================================
// 검색 이벤트
// ============================================================
elQ.addEventListener("input",()=>{
  renderSearchView();
});

elQ.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowDown"){
    e.preventDefault();

    if(elAC.style.display!=="block") renderAC();

    stepAC(+1);
  }
  else if(e.key==="ArrowUp"){
    e.preventDefault();

    if(elAC.style.display!=="block") renderAC();

    stepAC(-1);
  }
  else if(e.key==="Enter"){
    if(elAC.style.display==="block"&&acIndex>=0){
      e.preventDefault();
      chooseAC(acIndex);
    }
  }
  else if(e.key==="Escape"){
    closeAC();
  }
});

elQ.addEventListener("focus",()=>{
  if(suppressNextACOpen){
    suppressNextACOpen = false;
    return;
  }

  renderAC();
});

document.addEventListener("click",(e)=>{
  if(!elAC.contains(e.target)&&e.target!==elQ) closeAC();
});

elPPClose.addEventListener("click",closePersonPanel);

elClear.addEventListener("click",()=>{
  elQ.value="";
  closeAC();
  closePersonPanel();
  hideMediaBox();
  hideMetaBox();
  renderSearchView({showAC:false});
  focusQWithoutAC();
});

// ============================================================
// 초기화
// ============================================================
setView(getViewFromHash());
setActiveModeButtons();
slRenderTabs();
slRenderList();
hideMediaBox();
hideMetaBox();

setStatus("불러오는 중…",true,true);
connect();
</script>
</body>
</html>
